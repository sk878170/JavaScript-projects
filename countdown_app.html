<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>countdown</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }

        .main{
            width: 100%;
            height: 100%;
            background: url(https://imgs.search.brave.com/hvCpw8pMlgY3Q9hFHlebrbI0EUUSVR-nbmXRlTPHRU0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90My5m/dGNkbi5uZXQvanBn/LzAxLzAzLzA5LzA2/LzM2MF9GXzEwMzA5/MDY5MV94TnR5Zzkz/TVhQcGNYeENOTjdw/blg5TnpnRExpYTRr/Ti5qcGc);
            background-size: cover;
            background-position: center;
        }

        .overlay{
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="ovarlay">
            <!-- The overlay here is used to diminish the background so 
             that the clock is more visible. -->
            <h2>COMING SOON!!</h2>
        </div>
    </div>
</body>
</html>
