<!-- Demonstration of a live working clock -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>

    <style>
        html {
            text-align: center;
            font-size: 10px;
        }

        body {
            font-size: 2rem;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .clock {
            width: 400px;
            height: 400px;
            border: 4px solid black;
            border-radius: 50%;
            position: relative;
            padding: 2rem;
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.1),
                inset 0 0 0 3px #EFEFEF,
                inset 0 0 10px black,
                0 0 10px rgba(0, 0, 0, 0.2);
        }

        .clock_face {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .number {
            position: absolute;
            font-size: 1.5rem;
            transform: translate(-50%, -50%);
        }

        .hand {
            height: 6px;
            background: black;
            position: absolute;
            top: 50%;
            right: 50%;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }

        .second_hand {
            height: 2px;
            background: red;
            width: 40%;
        }

        .minute_hand {
            height: 4px;
            width: 40%;
        }

        .hour_hand {
            height: 6px;
            width: 25%;
        }
    </style>
</head>

<body>
    <div class="clock">
        <div class="clock_face">
            <!-- Numbers positioned dynamically -->
            <div class="number" style="top: 0%; left: 50%;">12</div>
            <div class="number" style="top: 10%; left: 75%;">1</div>
            <div class="number" style="top: 28%; left: 93%;">2</div>
            <div class="number" style="top: 50%; left: 100%;">3</div>
            <div class="number" style="top: 73%; left: 92%;">4</div>
            <div class="number" style="top: 93%; left: 76%;">5</div>
            <div class="number" style="top: 100%; left: 50%;">6</div>
            <div class="number" style="top: 89%; left: 20%;">7</div>
            <div class="number" style="top: 70%; left: 5%;">8</div>
            <div class="number" style="top: 50%; left: 0%;">9</div>
            <div class="number" style="top: 30%; left: 5%;">10</div>
            <div class="number" style="top: 10%; left: 22%;">11</div>
            <div class="hand hour_hand"></div>
            <div class="hand minute_hand"></div>
            <div class="hand second_hand"></div>
        </div>
    </div>

    <script>
        const secondHand = document.querySelector('.second_hand');
        const minuteHand = document.querySelector('.minute_hand');
        const hourHand = document.querySelector('.hour_hand');

        function setDate() {
            const now = new Date();

            const seconds = now.getSeconds();
            const secondsDegrees = ((seconds / 60) * 360) + 90;
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;

            const mins = now.getMinutes();
            const minutesDegrees = ((mins / 60) * 360) + ((seconds / 60) * 6) + 90;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;

            const hours = now.getHours();
            const hoursDegrees = ((hours % 12) / 12 * 360) + ((mins / 60) * 30) + 90;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
        }

        setInterval(setDate, 1000);
    </script>
</body>

</html>
