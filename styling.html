<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Update CSS variables using <span class="h1">JS</span></h2>
    <div class="controls">
        <label for="spacing">Spacing:</label>
        <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">
        
        <label for="blur">Blur:</label>
        <input id="blur" type="range" name="blur" min="0" max="20" value="0" data-sizing="px">
        
        <label for="base">Base color:</label>
        <input id="base" type="color" name="base" value="#ffc600"><br><br><br><br>

        <img src="360_F_103090691_xNtyg93MXPpcXxCNN7pnX9NzgDLia4kN.webp" alt="">

        <style>
            :root{
                --base: #ffc600;
                --spacing: 20px;
                --blur: 0px;
            }

            img{
                /* in css you have to use -- for variables */
                padding: var(--spacing);
                background: var(--base);
                filter: blur(var(--blur));
                
            }

            .h1{
                color: var(--base);
            }


            body{
                text-align: center;
                background: #193549;
                font-weight: 100;
                font-size: 50px;
            }

            .controls{
                margin-bottom: 50px;
            }

            a {
                color: var(--base);
                text-decoration: none;
            }

            input{
                width: 100px;
            }

            h2{
                color: white;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-style: oblique;
                
            }

            
        </style>

        <script>
            const inputs=document.querySelectorAll(".controls input")

            function handle_update(){
                const suffix = this.dataset.sizing || '';
                // dataset is an object that contains all the data attributes
                // the above line defines a suffix (px) for every sizing of element.
                // since color doesn't support sizing we use '' (null)

                document.documentElement.style.setProperty(`--${this.name}`, this.value + suffix);
            }

            inputs.forEach(input => input.addEventListener('change',handle_update))
            inputs.forEach(input => input.addEventListener('mousemove',handle_update))
            // this line logs the changes that occur by user or even by the movement of mouse
        </script>
    </div>
</body>
</html>
