<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-DO List</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .todo-app h2 img {
        width: 35px;
        margin-left: 10px;
      }

      .todo-app {
        width: 400px;
        background: rgba(255, 255, 255, 0.2);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .todo-app h2 {
        text-align: center;
        color: #fff;
        margin-bottom: 20px;
      }

      .row {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: #fff;
        font-size: 16px;
        padding: 10px;
      }

      button {
        border: none;
        outline: none;
        padding: 10px 20px;
        font-size: 16px;
        background: #ff758c;
        color: #fff;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #ff4b67;
      }

      ul {
        list-style: none;
      }

      ul li:hover {
        transform: scale(1.05);
      }

      ul li::before {
        content: "";
        position: absolute;
        height: 28px;
        width: 28px;
        border-radius: 50%;
        background-image: url("images/unchecked.png");
        background-size: cover;
        background-position: center;
        top: 12px;
        left: 10px;
      }

      ul li.checked {
        text-decoration: line-through;
        opacity: 0.7;
      }

      ul li.checked::before {
        background-image: url("images/checked.png");
      }

      ul li span {
        cursor: pointer;
        color: #ff4b67;
        font-size: 18px;
        transition: transform 0.3s ease;
      }

      ul li span:hover {
        color: #fff;
        transform: rotate(360deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="todo-app">
        <h2>
          To Do list <img src="../To-Do List APP/images/notes.png" alt="" />
        </h2>
        <div class="row">
          <input type="text" id="input-box" placeholder="Enter your task" />
          <button onclick="addTask()">ADD</button>
        </div>
        <ul id="list-container">
          <li id="checked">Task 1</li>
          <li id="unchecked">Task 2</li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
