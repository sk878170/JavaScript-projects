<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy"
    />

    <title>Password Generator</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: cornflowerblue;
      }

      .container {
        max-width: 500px;
        border-radius: 5px;
        background-color: aqua;
        padding: 40px 30px;
        box-shadow: 2px 2px 12px black;
      }

      h1 {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 36px;
        text-align: center;
        text-decoration: underline;
      }

      .input-box {
        position: relative;
        margin-bottom: 24px;
      }

      .input-box span {
        position: absolute;
        transform: translateY(-50%);
        top: 50%;
        right: 5%;
        color: #333333;
        font-size: 20px;
        cursor: pointer;
      }

      .passBox {
        width: 100%;
        height: 40px;
        padding: 8px;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 700;
        color: #333333;
        background-color: #f2f2f2;
        outline: none;
      }

      #sliderValue {
        width: 100%;
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        margin-top: 15px;
      }

      .row p {
        font-weight: 700;
      }

      .getbtn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        color: #ffffff;
        background-color: blue;
        cursor: pointer;
        margin-top: 30px;
      }

      .getbtn:hover {
        background-color: darkblue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>
      <div class="input-box">
        <input type="text" class="passBox" id="passBox" disabled />
        <!-- We have kept the input box disabled because user cannot enter any input
             instead he can copy from it -->
        <span
          class="material-symbols-outlined"
          id="copyIcon"
          onclick="copyPassword()"
          >content_copy</span
        >
      </div>
      <label for="inputSlider">Range</label>
      <input type="range" min="8" max="30" value="8" id="inputSlider" />
      <div class="row">
        <p>Password Length</p>
        <span id="sliderValue">10</span>
      </div>
      <div class="row">
        <label for="lowercase">Include lowercase</label>
        <input type="checkbox" id="lowercase" name="lowercase" checked />
      </div>
      <div class="row">
        <label for="uppercase">Include Uppercase</label>
        <input type="checkbox" id="uppercase" name="uppercase" checked />
      </div>
      <div class="row">
        <label for="numbers">Include numbers</label>
        <input type="checkbox" id="numbers" name="numbers" checked />
      </div>
      <div class="row">
        <label for="symbols">Include Special Characters</label>
        <input type="checkbox" id="symbols" name="symbols" checked />
      </div>
      <button type="button" class="getbtn" id="getbtn">
        Generate password
      </button>
    </div>

    <script>
      const inputSlider = document.getElementById("inputSlider");
      const sliderValue = document.getElementById("sliderValue");
      const passBox = document.getElementById("passBox");
      const lowercaseEl = document.getElementById("lowercase");
      const uppercaseEl = document.getElementById("uppercase");
      const numberEl = document.getElementById("numbers");
      const symbolsEl = document.getElementById("symbols"); // Fixed the ID reference
      const generateBtn = document.getElementById("getbtn");
      const copyIcon = document.getElementById("copyIcon"); // Fixed reference

      const lowercaseLetters = "abcdefghijklmnopqrstuvwxyz";
      const uppercaseLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const numbers = "0123456789";
      const symbols = "!@#$%^&*()_+-=[]{}\\|;':\",./<>?";

      // Update slider value display
      sliderValue.textContent = inputSlider.value;
      inputSlider.addEventListener("input", () => {
        sliderValue.textContent = inputSlider.value;
      });

      // Event listener for Generate Password button
      generateBtn.addEventListener("click", () => {
        passBox.value = generatePassword(); // Call the function
      });

      // Function to generate password
      function generatePassword() {
        const length = inputSlider.value;
        let characters = "";
        let password = "";

        if (lowercaseEl.checked) characters += lowercaseLetters;
        if (uppercaseEl.checked) characters += uppercaseLetters;
        if (numberEl.checked) characters += numbers;
        if (symbolsEl.checked) characters += symbols;

        if (characters.length === 0) {
          alert("Please select at least one character type.");
          return "";
        }

        for (let i = 0; i < length; i++) {
          password += characters.charAt(
            Math.floor(Math.random() * characters.length)
          );
        }

        return password;
      }

      // Copy password to clipboard
      copyIcon.addEventListener("click", () => {
        if (passBox.value !== "" && passBox.value.length >= 10) {
          navigator.clipboard.writeText(passBox.value);
          copyIcon.innerText = "check";

          setTimeout(() => {
            copyIcon.innerText = "content_copy";
          }, 3000);
        }
      });
    </script>
  </body>
</html>
